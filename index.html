<!DOCTYPE html>
<html lang="sl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Izčrpen kavni vodnik</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>☕ Izčrpen kavni vodnik</h1>

<p>
To je izčrpen kavni vodnik, ki vključuje vse vrste kavnih napitkov,
njihovo definicijo, pripravo in izvor.
</p>

<h3>Z besedo "kava" se bomo v sklopu tega vodnika nanašali zgolj na plod kavovca in občasno v sklopu lastnega imena posameznega kavnega napitka.</h3>
  
</header>

<div class="category-buttons">

<button data-category="all">Vsi</button>
<button data-category="espresso">Espresso</button>
<button data-category="milk">Espresso + mleko</button>
<button data-category="methods">Načini priprave</button>
<button data-category="regional">Regionalno</button>
<button data-category="cold">Ledeno in hladno</button>
<button data-category="dessert">Sladice</button>
<button data-category="alcohol">Z žganjem</button>

</div>

<h2 id="category-title">
Vsi kavni napitki
</h2>

<div id="coffee-container" class="coffee-grid">

</div>

<div id="coffee-detail">

</div>

<script src="coffee-data.js"></script>
<script src="script.js"></script>

</body>

</html>
